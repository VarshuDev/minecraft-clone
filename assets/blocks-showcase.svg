<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    <filter id="blockGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes orePulse {
        0%, 100% { fill: #3bc9db; filter: drop-shadow(0 0 2px #3bc9db); }
        50% { fill: #a5f3fc; filter: drop-shadow(0 0 8px #66d9e8); }
      }
      @keyframes tntFuseBlink {
        0%, 100% { fill: #ff6b6b; }
        50% { fill: #ffffff; }
      }
      @keyframes torchFlame {
        0%, 100% { transform: scaleY(1); fill: #ff922b; }
        50% { transform: scaleY(1.22); fill: #ffe066; }
      }
      @keyframes waterShimmer {
        0%, 100% { fill: #228be6; opacity: 0.75; }
        50% { fill: #4dabf7; opacity: 0.9; }
      }
      @keyframes blockHop {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      .ore-glow { animation: orePulse 2s ease-in-out infinite; }
      .fuse-glow { animation: tntFuseBlink 0.9s ease-in-out infinite; }
      .torch-anim { transform-origin: bottom center; animation: torchFlame 0.35s ease-in-out infinite; }
      .water-anim { animation: waterShimmer 2.5s ease-in-out infinite; }
      .b-hop { animation: blockHop 3.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="130" fill="#0b101c" rx="8" stroke="#1d273d" stroke-width="1.5" />

  <!-- 8 Authentic Isometric Minecraft Blocks -->
  
  <!-- 1: Grass Block -->
  <g class="b-hop" transform="translate(45, 30)">
    <polygon points="32,0 64,16 32,32 0,16" fill="#6bbe30" stroke="#3b7218" stroke-width="1" />
    <polygon points="0,16 32,32 32,64 0,48" fill="#865c3a" stroke="#482e18" stroke-width="1" />
    <polygon points="0,16 32,32 32,42 24,37 18,44 10,38 0,42" fill="#5b9b26" />
    <polygon points="32,32 64,16 64,48 32,64" fill="#6c482c" stroke="#482e18" stroke-width="1" />
    <polygon points="32,32 64,16 64,26 56,31 48,25 40,32 32,28" fill="#4a801e" />
    <text x="32" y="80" font-family="'Courier New', monospace" font-size="9" fill="#a9e38a" text-anchor="middle" font-weight="bold">GRASS</text>
  </g>

  <!-- 2: Diamond Ore -->
  <g class="b-hop" transform="translate(150, 30)" style="animation-delay: -0.4s;">
    <polygon points="32,0 64,16 32,32 0,16" fill="#888e99" stroke="#50545c" stroke-width="1" />
    <rect x="22" y="10" width="6" height="4" class="ore-glow" />
    <polygon points="0,16 32,32 32,64 0,48" fill="#737984" stroke="#454952" stroke-width="1" />
    <polygon points="10,32 18,29 20,36 12,39" class="ore-glow" />
    <polygon points="16,46 24,43 26,50 18,53" class="ore-glow" />
    <polygon points="32,32 64,16 64,48 32,64" fill="#5d626c" stroke="#3b3e45" stroke-width="1" />
    <polygon points="42,30 50,26 54,34 46,38" class="ore-glow" />
    <text x="32" y="80" font-family="'Courier New', monospace" font-size="9" fill="#66d9e8" text-anchor="middle" font-weight="bold">DIAMOND</text>
  </g>

  <!-- 3: TNT Block -->
  <g class="b-hop" transform="translate(255, 30)" style="animation-delay: -0.8s;">
    <!-- Top Face (Red with center fuse) -->
    <polygon points="32,0 64,16 32,32 0,16" fill="#c92a2a" stroke="#821414" stroke-width="1" />
    <circle cx="32" cy="16" r="3" class="fuse-glow" />
    <!-- Left Face with TNT text -->
    <polygon points="0,16 32,32 32,64 0,48" fill="#b02525" stroke="#701010" stroke-width="1" />
    <polygon points="0,28 32,44 32,54 0,38" fill="#f8f9fa" />
    <text x="16" y="44" font-family="'Impact', sans-serif" font-size="10" fill="#212529" text-anchor="middle" transform="skewY(26) scale(1, 0.9)">TNT</text>
    <!-- Right Face -->
    <polygon points="32,32 64,16 64,48 32,64" fill="#8f1b1b" stroke="#701010" stroke-width="1" />
    <polygon points="32,44 64,28 64,38 32,54" fill="#f8f9fa" />
    <text x="48" y="44" font-family="'Impact', sans-serif" font-size="10" fill="#212529" text-anchor="middle" transform="skewY(-26) scale(1, 0.9)">TNT</text>
    <text x="32" y="80" font-family="'Courier New', monospace" font-size="9" fill="#ff8787" text-anchor="middle" font-weight="bold">TNT</text>
  </g>

  <!-- 4: Crafting Table -->
  <g class="b-hop" transform="translate(360, 30)" style="animation-delay: -1.2s;">
    <!-- Top Grid Grid (Plank pattern with grid) -->
    <polygon points="32,0 64,16 32,32 0,16" fill="#c69b5e" stroke="#7a5528" stroke-width="1" />
    <line x1="32" y1="8" x2="32" y2="24" stroke="#7a5528" stroke-width="1" />
    <line x1="16" y1="16" x2="48" y2="16" stroke="#7a5528" stroke-width="1" />
    <!-- Left Face with tool saw silhouette -->
    <polygon points="0,16 32,32 32,64 0,48" fill="#a87f48" stroke="#61411a" stroke-width="1" />
    <rect x="6" y="32" width="18" height="6" fill="#343a40" transform="skewY(26)" />
    <!-- Right Face with hammer silhouette -->
    <polygon points="32,32 64,16 64,48 32,64" fill="#8f6b3a" stroke="#61411a" stroke-width="1" />
    <rect x="40" y="32" width="16" height="5" fill="#343a40" transform="skewY(-26)" />
    <text x="32" y="80" font-family="'Courier New', monospace" font-size="9" fill="#ffd43b" text-anchor="middle" font-weight="bold">WORKBENCH</text>
  </g>

  <!-- 5: Oak Log -->
  <g class="b-hop" transform="translate(465, 30)" style="animation-delay: -1.6s;">
    <!-- Top Growth Rings -->
    <polygon points="32,0 64,16 32,32 0,16" fill="#a17d4a" stroke="#5a3d1c" stroke-width="1" />
    <polygon points="32,6 52,16 32,26 12,16" fill="#805d2e" />
    <polygon points="32,10 44,16 32,22 20,16" fill="#66461d" />
    <!-- Left Bark -->
    <polygon points="0,16 32,32 32,64 0,48" fill="#4d351e" stroke="#2b1b0b" stroke-width="1" />
    <line x1="10" y1="21" x2="10" y2="53" stroke="#332110" stroke-width="1.5" />
    <line x1="22" y1="27" x2="22" y2="59" stroke="#332110" stroke-width="1.5" />
    <!-- Right Bark -->
    <polygon points="32,32 64,16 64,48 32,64" fill="#382412" stroke="#2b1b0b" stroke-width="1" />
    <line x1="42" y1="37" x2="42" y2="53" stroke="#261708" stroke-width="1.5" />
    <line x1="54" y1="31" x2="54" y2="47" stroke="#261708" stroke-width="1.5" />
    <text x="32" y="80" font-family="'Courier New', monospace" font-size="9" fill="#c69b5e" text-anchor="middle" font-weight="bold">OAK LOG</text>
  </g>

  <!-- 6: Torch (3D) -->
  <g class="b-hop" transform="translate(570, 30)" style="animation-delay: -2s;">
    <!-- Wooden Post -->
    <rect x="28" y="24" width="8" height="34" fill="#78471f" stroke="#422209" stroke-width="1" rx="1" />
    <!-- Charcoal Head -->
    <rect x="27" y="16" width="10" height="9" fill="#2b2622" />
    <!-- Animated Flame -->
    <g class="torch-anim" transform="translate(32, 6)">
      <polygon points="0,-12 6,-3 4,4 -4,4 -6,-3" fill="#ff922b" filter="url(#blockGlow)" />
      <polygon points="0,-9 4,-2 2.5,2 -2.5,2 -4,-2" fill="#ffe066" />
    </g>
    <text x="32" y="80" font-family="'Courier New', monospace" font-size="9" fill="#ffc078" text-anchor="middle" font-weight="bold">TORCH</text>
  </g>

  <!-- 7: Water Block (Translucent Shimmer) -->
  <g class="b-hop" transform="translate(675, 30)" style="animation-delay: -2.4s;">
    <polygon points="32,0 64,16 32,32 0,16" class="water-anim" stroke="#1864ab" stroke-width="1" />
    <polygon points="0,16 32,32 32,64 0,48" fill="#1971c2" opacity="0.8" stroke="#1864ab" stroke-width="1" />
    <polygon points="32,32 64,16 64,48 32,64" fill="#1864ab" opacity="0.9" stroke="#0e3a66" stroke-width="1" />
    <text x="32" y="80" font-family="'Courier New', monospace" font-size="9" fill="#74c0fc" text-anchor="middle" font-weight="bold">WATER</text>
  </g>

  <!-- 8: Glowstone -->
  <g class="b-hop" transform="translate(780, 30)" style="animation-delay: -2.8s;">
    <polygon points="32,0 64,16 32,32 0,16" fill="#ffd43b" stroke="#e67700" stroke-width="1" filter="url(#blockGlow)" />
    <rect x="18" y="8" width="6" height="5" fill="#fff3bf" />
    <rect x="38" y="14" width="7" height="6" fill="#ffe066" />
    <polygon points="0,16 32,32 32,64 0,48" fill="#fab005" stroke="#c25e00" stroke-width="1" />
    <polygon points="32,32 64,16 64,48 32,64" fill="#f59f00" stroke="#a64d00" stroke-width="1" />
    <text x="32" y="80" font-family="'Courier New', monospace" font-size="9" fill="#ffe066" text-anchor="middle" font-weight="bold">GLOWSTONE</text>
  </g>
</svg>
