<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="60%" stop-color="#111c34" />
      <stop offset="100%" stop-color="#192a4e" />
    </linearGradient>

    <linearGradient id="mountGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2d4f" />
      <stop offset="100%" stop-color="#0d1629" />
    </linearGradient>

    <linearGradient id="goldPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdf73" />
      <stop offset="50%" stop-color="#cf9230" />
      <stop offset="100%" stop-color="#8c5813" />
    </linearGradient>

    <linearGradient id="diamondSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8affff" />
      <stop offset="50%" stop-color="#3ed9dc" />
      <stop offset="100%" stop-color="#148c9e" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes starPulse {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.3); }
      }
      @keyframes cloudDrift1 {
        0% { transform: translateX(-240px); }
        100% { transform: translateX(940px); }
      }
      @keyframes cloudDrift2 {
        0% { transform: translateX(-160px); }
        100% { transform: translateX(940px); }
      }
      @keyframes floatCube {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-9px) rotate(1.5deg); }
      }
      @keyframes floatPick {
        0%, 100% { transform: translateY(0px) rotate(-18deg); }
        50% { transform: translateY(-8px) rotate(-28deg); }
      }
      @keyframes flameFlicker {
        0%, 100% { transform: scaleY(1) scaleX(1); fill: #ffb43a; }
        25% { transform: scaleY(1.15) scaleX(0.92); fill: #ffdc52; }
        50% { transform: scaleY(0.9) scaleX(1.08); fill: #ff8c26; }
        75% { transform: scaleY(1.18) scaleX(0.96); fill: #ffe86b; }
      }
      @keyframes diamondGlint {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.4); }
      }
      @keyframes bannerShimmer {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(255,223,115,0.4)); }
        50% { filter: drop-shadow(0 0 14px rgba(255,223,115,0.85)); }
      }
      @keyframes subGlow {
        0%, 100% { opacity: 0.88; }
        50% { opacity: 1; text-shadow: 0 0 10px #52ffb8; }
      }

      .star { transform-origin: center; animation: starPulse 2.8s ease-in-out infinite; }
      .c1 { animation: cloudDrift1 48s linear infinite; }
      .c2 { animation: cloudDrift2 34s linear infinite; }
      .cube-float { animation: floatCube 4.2s ease-in-out infinite; }
      .pick-float { transform-origin: 80px 80px; animation: floatPick 3.2s ease-in-out infinite; }
      .flame { transform-origin: bottom center; animation: flameFlicker 0.4s ease-in-out infinite; }
      .glint { transform-origin: center; animation: diamondGlint 1.8s ease-in-out infinite; }
      .banner-box { animation: bannerShimmer 3s ease-in-out infinite; }
      .sub-pulse { animation: subGlow 2.5s ease-in-out infinite; font-family: 'Courier New', monospace, monospace; }
    </style>
  </defs>

  <!-- Sky Background -->
  <rect width="900" height="290" fill="url(#skyGrad)" rx="10" />

  <!-- Stars -->
  <g fill="#ffffff">
    <rect x="52" y="32" width="3" height="3" class="star" style="animation-delay: 0.2s;" />
    <rect x="110" y="74" width="2" height="2" class="star" style="animation-delay: 1.1s;" />
    <rect x="180" y="24" width="4" height="4" class="star" style="animation-delay: 0.7s;" />
    <rect x="250" y="58" width="2" height="2" class="star" style="animation-delay: 1.8s;" />
    <rect x="340" y="30" width="3" height="3" class="star" style="animation-delay: 0.4s;" />
    <rect x="420" y="65" width="2" height="2" class="star" style="animation-delay: 2.1s;" />
    <rect x="510" y="22" width="4" height="4" class="star" style="animation-delay: 1.4s;" />
    <rect x="620" y="48" width="3" height="3" class="star" style="animation-delay: 0.9s;" />
    <rect x="710" y="28" width="2" height="2" class="star" style="animation-delay: 1.6s;" />
    <rect x="790" y="62" width="3" height="3" class="star" style="animation-delay: 0.3s;" />
    <rect x="850" y="36" width="4" height="4" class="star" style="animation-delay: 1.9s;" />
    <rect x="80" y="110" width="2" height="2" class="star" style="animation-delay: 2.4s;" />
    <rect x="815" y="105" width="2" height="2" class="star" style="animation-delay: 0.5s;" />
  </g>

  <!-- Distant Mountains -->
  <polygon points="0,220 90,165 190,210 320,150 460,225 610,140 740,215 840,160 900,195 900,290 0,290" fill="url(#mountGrad)" opacity="0.75" />
  <polygon points="0,240 140,185 270,245 410,180 560,245 710,175 830,235 900,210 900,290 0,290" fill="#090e1c" opacity="0.9" />

  <!-- Animated Pixel Clouds -->
  <g opacity="0.22" fill="#d2e3ff" shape-rendering="crispEdges">
    <g class="c1">
      <rect x="0" y="44" width="72" height="14" />
      <rect x="14" y="34" width="44" height="10" />
      <rect x="28" y="26" width="22" height="8" />
    </g>
    <g class="c2">
      <rect x="120" y="80" width="94" height="16" />
      <rect x="140" y="68" width="60" height="12" />
      <rect x="160" y="58" width="30" height="10" />
    </g>
  </g>

  <!-- Left: Animated Isometric Grass Block & Torch -->
  <g transform="translate(65, 125)">
    <g class="cube-float">
      <!-- 3D Isometric Grass Voxel -->
      <g shape-rendering="crispEdges">
        <!-- Top Face (Green Grass) -->
        <polygon points="50,0 100,25 50,50 0,25" fill="#6bbe30" stroke="#3b7218" stroke-width="1.5" />
        <polygon points="50,6 88,25 50,44 12,25" fill="#7ed438" />
        <rect x="42" y="16" width="6" height="5" fill="#589e24" />
        <rect x="58" y="24" width="5" height="4" fill="#8ee844" />
        <rect x="30" y="28" width="7" height="4" fill="#589e24" />

        <!-- Left Face (Dirt with hanging grass fringe) -->
        <polygon points="0,25 50,50 50,110 0,85" fill="#865c3a" stroke="#482e18" stroke-width="1.5" />
        <polygon points="0,25 50,50 50,68 40,62 34,70 24,60 16,68 8,60 0,66" fill="#5b9b26" />
        <!-- Dirt noise bits -->
        <rect x="12" y="74" width="6" height="6" fill="#6c482b" />
        <rect x="28" y="86" width="8" height="6" fill="#9b6e47" />
        <rect x="36" y="72" width="7" height="6" fill="#5c3c22" />

        <!-- Right Face (Darker Shaded Dirt) -->
        <polygon points="50,50 100,25 100,85 50,110" fill="#6c482c" stroke="#482e18" stroke-width="1.5" />
        <polygon points="50,50 100,25 100,42 92,48 84,40 76,50 68,44 60,52 50,46" fill="#4a801e" />
        <!-- Right face dirt bits -->
        <rect x="62" y="72" width="6" height="5" fill="#55361e" />
        <rect x="78" y="80" width="7" height="6" fill="#805634" />
      </g>

      <!-- Animated Torch on top -->
      <g transform="translate(46, -34)">
        <!-- Wood stick -->
        <rect x="2" y="14" width="5" height="22" fill="#7c4e25" stroke="#472b11" stroke-width="1" />
        <!-- Coal tip -->
        <rect x="1" y="8" width="7" height="6" fill="#2d2925" />
        <!-- Animated Flame -->
        <g class="flame">
          <polygon points="4.5,0 9,7 7,12 2,12 0,7" fill="#ffb43a" filter="url(#glow)" />
          <polygon points="4.5,2 7,8 5.5,10 3.5,10 2,8" fill="#fff494" />
        </g>
      </g>
    </g>
  </g>

  <!-- Right: Animated Diamond Ore Block & Pickaxe -->
  <g transform="translate(735, 125)">
    <g class="cube-float" style="animation-delay: -2.1s;">
      <!-- 3D Isometric Diamond Ore Voxel -->
      <g shape-rendering="crispEdges">
        <!-- Top Face (Stone + Cyan Gems) -->
        <polygon points="50,0 100,25 50,50 0,25" fill="#888e99" stroke="#50545c" stroke-width="1.5" />
        <rect x="35" y="16" width="9" height="7" fill="url(#diamondSheen)" />
        <rect x="60" y="26" width="8" height="6" fill="url(#diamondSheen)" />

        <!-- Left Face (Stone + Diamond Vein) -->
        <polygon points="0,25 50,50 50,110 0,85" fill="#737984" stroke="#454952" stroke-width="1.5" />
        <!-- Glowing Diamond clusters -->
        <polygon points="18,52 28,48 32,58 22,64" fill="url(#diamondSheen)" filter="url(#glow)" />
        <polygon points="26,76 38,72 42,84 30,90" fill="url(#diamondSheen)" filter="url(#glow)" />
        <rect x="10" y="70" width="6" height="5" fill="#2ebec4" />

        <!-- Right Face (Darker Stone + Diamond) -->
        <polygon points="50,50 100,25 100,85 50,110" fill="#5d626c" stroke="#3b3e45" stroke-width="1.5" />
        <polygon points="65,48 78,42 84,54 72,60" fill="url(#diamondSheen)" filter="url(#glow)" />
        <polygon points="60,78 72,74 76,86 64,90" fill="url(#diamondSheen)" filter="url(#glow)" />
      </g>

      <!-- Animated Diamond Glint Sparkles -->
      <g transform="translate(25, 54)">
        <g class="glint">
          <polygon points="0,-6 2,-2 6,0 2,2 0,6 -2,2 -6,0 -2,-2" fill="#ffffff" filter="url(#glow)" />
        </g>
      </g>
      <g transform="translate(75, 48)">
        <g class="glint" style="animation-delay: 0.9s;">
          <polygon points="0,-5 2,-1 5,0 2,1 0,5 -2,1 -5,0 -2,-1" fill="#c4ffff" filter="url(#glow)" />
        </g>
      </g>
    </g>
  </g>

  <!-- Animated Diamond Pickaxe swinging on Right Header -->
  <g transform="translate(680, 20)">
    <g class="pick-float">
      <!-- Wooden handle -->
      <rect x="42" y="14" width="6" height="56" rx="1" fill="#8a5323" stroke="#48270b" stroke-width="1.2" transform="rotate(-45 45 42)" />
      <!-- Pickaxe Crosshead -->
      <path d="M 12 18 C 28 8, 54 8, 70 18 L 62 26 C 50 19, 32 19, 20 26 Z" fill="#32c7cf" stroke="#106f75" stroke-width="1.5" filter="url(#glow)" />
      <polygon points="12,18 20,26 8,28" fill="#58f0f8" />
      <polygon points="70,18 62,26 74,28" fill="#1b858c" />
      <rect x="38" y="18" width="6" height="6" fill="#8a5323" />
    </g>
  </g>

  <!-- Center: Epic Minecraft Typography -->
  <g text-anchor="middle">
    <!-- Big Beveled 3D MINECRAFT Title -->
    <!-- 3D Shadow Layer -->
    <text x="454" y="104" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" letter-spacing="5" fill="#101010">MINECRAFT</text>
    <text x="452" y="102" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" letter-spacing="5" fill="#2d2d2d">MINECRAFT</text>
    <text x="450" y="100" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" letter-spacing="5" fill="#4d4d4d">MINECRAFT</text>
    <!-- Front Face (Pixel Beveled Stone Texture) -->
    <text x="448" y="98" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="64" letter-spacing="5" fill="#e6e6e6" stroke="#1d1d1d" stroke-width="2">MINECRAFT</text>

    <!-- '3D' Badge in Diamond Cyan -->
    <g transform="translate(668, 48)">
      <rect x="0" y="0" width="68" height="34" rx="4" fill="#0d2e36" stroke="#32c7cf" stroke-width="2" filter="url(#glow)" />
      <text x="34" y="24" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" fill="#5cf3fa" letter-spacing="2">3D</text>
    </g>

    <!-- Gold Plaque: BROWSER EDITION -->
    <g class="banner-box" transform="translate(290, 122)">
      <!-- Beveled Outer Border -->
      <polygon points="0,15 15,0 305,0 320,15 305,30 15,30" fill="#382205" stroke="#1a0f02" stroke-width="2" />
      <polygon points="4,15 17,4 303,4 316,15 303,26 17,26" fill="url(#goldPlate)" />
      <text x="160" y="20" font-family="'Impact', 'Arial Black', sans-serif" font-size="16" letter-spacing="4" fill="#ffffff" stroke="#523204" stroke-width="1.2">BROWSER EDITION</text>
    </g>

    <!-- Subtitle: Feature Tagline with Animated Emerald Pulse -->
    <text x="450" y="186" class="sub-pulse" font-size="12.5" font-weight="bold" letter-spacing="2.2" fill="#52ffb8">
      INFINITE VOXEL CHUNKS · PROCEDURAL BIOMES · REAL SURVIVAL
    </text>

    <!-- Specs Pills Row -->
    <g transform="translate(205, 210)" font-family="'Courier New', monospace, monospace" font-size="10.5" font-weight="bold">
      <!-- Pill 1: 60 FPS Engine -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="115" height="24" rx="3" fill="#0a1813" stroke="#258257" stroke-width="1.2" />
        <circle cx="14" cy="12" r="4" fill="#44ff95" filter="url(#glow)" />
        <text x="64" y="16" fill="#a8ffce" letter-spacing="1">60 FPS</text>
      </g>
      <!-- Pill 2: 26 Block Types -->
      <g transform="translate(125, 0)">
        <rect x="0" y="0" width="115" height="24" rx="3" fill="#1b160a" stroke="#876b25" stroke-width="1.2" />
        <rect x="10" y="7" width="8" height="10" fill="#ffcf40" />
        <text x="66" y="16" fill="#ffe28a" letter-spacing="1">26 BLOCKS</text>
      </g>
      <!-- Pill 3: 3D Caves & Ores -->
      <g transform="translate(250, 0)">
        <rect x="0" y="0" width="115" height="24" rx="3" fill="#0e1726" stroke="#2c518c" stroke-width="1.2" />
        <polygon points="14,6 20,17 8,17" fill="#4dabf7" />
        <text x="67" y="16" fill="#bfe0ff" letter-spacing="1">3D CAVES</text>
      </g>
      <!-- Pill 4: Zero Asset Bundle -->
      <g transform="translate(375, 0)">
        <rect x="0" y="0" width="115" height="24" rx="3" fill="#1c0e18" stroke="#822e6b" stroke-width="1.2" />
        <circle cx="14" cy="12" r="4" fill="#ff5ebd" />
        <text x="66" y="16" fill="#ffbce5" letter-spacing="1">PROCEDURAL</text>
      </g>
    </g>

    <!-- Bottom Bedrock Line Bar -->
    <g transform="translate(120, 260)" shape-rendering="crispEdges">
      <rect x="0" y="0" width="660" height="4" fill="#363942" />
      <rect x="150" y="0" width="80" height="4" fill="#52ffb8" opacity="0.8" />
      <rect x="430" y="0" width="80" height="4" fill="#32c7cf" opacity="0.8" />
    </g>
  </g>
</svg>
