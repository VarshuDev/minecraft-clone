<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <linearGradient id="hudFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#495057" />
      <stop offset="100%" stop-color="#212529" />
    </linearGradient>

    <linearGradient id="keyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#343a40" />
      <stop offset="100%" stop-color="#1a1d20" />
    </linearGradient>

    <style>
      @keyframes keyPulse {
        0%, 100% { border-color: #495057; stroke: #495057; }
        50% { stroke: #51cf66; }
      }
      @keyframes clickAnim {
        0%, 100% { fill: #343a40; }
        50% { fill: #fa5252; }
      }
      @keyframes rightClickAnim {
        0%, 100% { fill: #343a40; }
        50% { fill: #4dabf7; }
      }

      .key-border { animation: keyPulse 2.4s ease-in-out infinite; }
      .left-click { animation: clickAnim 1.6s ease-in-out infinite; }
      .right-click { animation: rightClickAnim 1.6s ease-in-out infinite; animation-delay: -0.8s; }
      .mono-txt { font-family: 'Courier New', monospace; font-weight: bold; }
    </style>
  </defs>

  <!-- HUD Container Frame (Beveled Stone) -->
  <rect width="900" height="170" fill="url(#hudFrame)" rx="8" stroke="#121416" stroke-width="2" />
  <rect x="4" y="4" width="892" height="162" fill="#1e2227" rx="6" />

  <!-- Title Badge -->
  <g transform="translate(24, 16)">
    <rect width="180" height="24" rx="3" fill="#121518" stroke="#373b42" stroke-width="1.2" />
    <text x="90" y="16" class="mono-txt" font-size="11" fill="#a5d8ff" text-anchor="middle" letter-spacing="1">CONTROLS &amp; INPUTS</text>
  </g>

  <!-- Control Cards -->
  <!-- 1: WASD Movement -->
  <g transform="translate(30, 52)">
    <rect width="125" height="100" rx="5" fill="url(#keyGrad)" stroke="#373b40" stroke-width="1.2" class="key-border" />
    <!-- WASD Keys cluster -->
    <g transform="translate(36, 12)">
      <!-- W Key -->
      <rect x="18" y="0" width="18" height="18" rx="2" fill="#495057" stroke="#6c757d" stroke-width="1" />
      <text x="27" y="13" class="mono-txt" font-size="10" fill="#ffffff" text-anchor="middle">W</text>
      <!-- A Key -->
      <rect x="0" y="20" width="18" height="18" rx="2" fill="#495057" stroke="#6c757d" stroke-width="1" />
      <text x="9" y="33" class="mono-txt" font-size="10" fill="#ffffff" text-anchor="middle">A</text>
      <!-- S Key -->
      <rect x="20" y="20" width="18" height="18" rx="2" fill="#495057" stroke="#6c757d" stroke-width="1" />
      <text x="29" y="33" class="mono-txt" font-size="10" fill="#ffffff" text-anchor="middle">S</text>
      <!-- D Key -->
      <rect x="40" y="20" width="18" height="18" rx="2" fill="#495057" stroke="#6c757d" stroke-width="1" />
      <text x="49" y="33" class="mono-txt" font-size="10" fill="#ffffff" text-anchor="middle">D</text>
    </g>
    <text x="62" y="70" class="mono-txt" font-size="11" fill="#f8f9fa" text-anchor="middle">WALK</text>
    <text x="62" y="86" class="mono-txt" font-size="8.5" fill="#868e96" text-anchor="middle">2x W: Sprint</text>
  </g>

  <!-- 2: Space / Jump & Fly -->
  <g transform="translate(172, 52)">
    <rect width="125" height="100" rx="5" fill="url(#keyGrad)" stroke="#373b40" stroke-width="1.2" class="key-border" style="animation-delay: -0.4s;" />
    <!-- Spacebar graphic -->
    <rect x="22" y="24" width="80" height="20" rx="3" fill="#495057" stroke="#6c757d" stroke-width="1" />
    <text x="62" y="38" class="mono-txt" font-size="9" fill="#ffffff" text-anchor="middle">SPACEBAR</text>
    <text x="62" y="70" class="mono-txt" font-size="11" fill="#f8f9fa" text-anchor="middle">JUMP</text>
    <text x="62" y="86" class="mono-txt" font-size="8.5" fill="#868e96" text-anchor="middle">2x: Toggle Fly</text>
  </g>

  <!-- 3: Left Mouse (Mine) -->
  <g transform="translate(314, 52)">
    <rect width="125" height="100" rx="5" fill="url(#keyGrad)" stroke="#373b40" stroke-width="1.2" class="key-border" style="animation-delay: -0.8s;" />
    <!-- Mouse graphic with highlighted left click -->
    <g transform="translate(48, 12)">
      <rect x="0" y="0" width="28" height="42" rx="14" fill="#212529" stroke="#6c757d" stroke-width="1" />
      <path d="M 0,14 C 0,6 6,0 14,0 L 14,18 L 0,18 Z" class="left-click" />
      <path d="M 28,14 C 28,6 22,0 14,0 L 14,18 L 28,18 Z" fill="#343a40" />
      <line x1="14" y1="0" x2="14" y2="18" stroke="#121416" stroke-width="1" />
      <line x1="0" y1="18" x2="28" y2="18" stroke="#121416" stroke-width="1" />
    </g>
    <text x="62" y="70" class="mono-txt" font-size="11" fill="#ff8787" text-anchor="middle">MINE / ATTACK</text>
    <text x="62" y="86" class="mono-txt" font-size="8.5" fill="#868e96" text-anchor="middle">Hold to break</text>
  </g>

  <!-- 4: Right Mouse (Place & Interact) -->
  <g transform="translate(456, 52)">
    <rect width="125" height="100" rx="5" fill="url(#keyGrad)" stroke="#373b40" stroke-width="1.2" class="key-border" style="animation-delay: -1.2s;" />
    <!-- Mouse graphic with highlighted right click -->
    <g transform="translate(48, 12)">
      <rect x="0" y="0" width="28" height="42" rx="14" fill="#212529" stroke="#6c757d" stroke-width="1" />
      <path d="M 0,14 C 0,6 6,0 14,0 L 14,18 L 0,18 Z" fill="#343a40" />
      <path d="M 28,14 C 28,6 22,0 14,0 L 14,18 L 28,18 Z" class="right-click" />
      <line x1="14" y1="0" x2="14" y2="18" stroke="#121416" stroke-width="1" />
      <line x1="0" y1="18" x2="28" y2="18" stroke="#121416" stroke-width="1" />
    </g>
    <text x="62" y="70" class="mono-txt" font-size="11" fill="#74c0fc" text-anchor="middle">PLACE / USE</text>
    <text x="62" y="86" class="mono-txt" font-size="8.5" fill="#868e96" text-anchor="middle">Interact / Craft</text>
  </g>

  <!-- 5: E Key (Inventory / Crafting) -->
  <g transform="translate(598, 52)">
    <rect width="125" height="100" rx="5" fill="url(#keyGrad)" stroke="#373b40" stroke-width="1.2" class="key-border" style="animation-delay: -1.6s;" />
    <rect x="50" y="16" width="26" height="26" rx="3" fill="#495057" stroke="#6c757d" stroke-width="1" />
    <text x="63" y="34" class="mono-txt" font-size="15" fill="#ffd43b" text-anchor="middle">E</text>
    <text x="62" y="70" class="mono-txt" font-size="11" fill="#ffd43b" text-anchor="middle">CRAFTING</text>
    <text x="62" y="86" class="mono-txt" font-size="8.5" fill="#868e96" text-anchor="middle">2x2 &amp; Inventory</text>
  </g>

  <!-- 6: 1-9 Hotbar & F3 Debug -->
  <g transform="translate(740, 52)">
    <rect width="130" height="100" rx="5" fill="url(#keyGrad)" stroke="#373b40" stroke-width="1.2" class="key-border" style="animation-delay: -2s;" />
    <!-- 1..9 Row & F3 button -->
    <g transform="translate(20, 16)">
      <rect x="0" y="0" width="38" height="22" rx="2" fill="#495057" stroke="#6c757d" stroke-width="1" />
      <text x="19" y="15" class="mono-txt" font-size="10" fill="#69db7c" text-anchor="middle">1–9</text>
      <rect x="46" y="0" width="38" height="22" rx="2" fill="#495057" stroke="#6c757d" stroke-width="1" />
      <text x="65" y="15" class="mono-txt" font-size="10" fill="#a5d8ff" text-anchor="middle">F3</text>
    </g>
    <text x="65" y="70" class="mono-txt" font-size="11" fill="#b197fc" text-anchor="middle">HOTBAR &amp; F3</text>
    <text x="65" y="86" class="mono-txt" font-size="8.5" fill="#868e96" text-anchor="middle">Wheel: Scroll Slot</text>
  </g>
</svg>
